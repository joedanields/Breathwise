version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (ADR-009): typescript-eslint does not support TS 7 yet,
      # eslint-plugin-jsx-a11y does not support ESLint 10, and @types/node tracks .nvmrc (22).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      - dependency-name: '@types/node'
        versions: ['>=23']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
