# Cloudflare Pages config — see docs/DEPLOYMENT.md.
# Never put secrets here. GEMINI_API_KEY is a Cloudflare secret (or .dev.vars locally).
name = "breathwise"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Production. Per-IP + daily rate limiting for /api/advise (docs/SECURITY.md §3).
# KV ids are identifiers, not secrets.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "250e22da7d1047548b6caa7f2708bda8"

[vars]
# gemini-3.5-flash-lite: answers in ~3 s; gemini-3.8-flash did not answer within 60 s on 2026-11-28 (ADR-013).
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Comma-separated. An entry starting with "https://*." is a suffix match on the host
# (preview deploys are https://<hash>.breathwise.pages.dev).
ALLOWED_ORIGINS = "https://breathwise.pages.dev,https://*.breathwise.pages.dev,http://localhost:5173,http://localhost:8788"

# Preview deploys (non-production branches). Pages does not inherit kv_namespaces or vars
# into an environment, so both are repeated here with a separate KV namespace.
[env.preview]
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ffaf36aa1e714e3ead361e7e51782511"

[env.preview.vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://breathwise.pages.dev,https://*.breathwise.pages.dev,http://localhost:5173,http://localhost:8788"
